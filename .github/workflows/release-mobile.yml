name: Release Mobile

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: cd apps/mobile && npx expo prebuild --clean --platform android
      - run: cd apps/mobile/android && ./gradlew assembleRelease --no-daemon
      - name: Verify release APK exists
        run: ls apps/mobile/android/app/build/outputs/apk/release/
      - name: Rename APK with release version
        run: |
          cd apps/mobile/android/app/build/outputs/apk/release
          apk=$(ls app-release*.apk | head -n1)
          mv "$apk" "FileSync-${{ github.ref_name }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
